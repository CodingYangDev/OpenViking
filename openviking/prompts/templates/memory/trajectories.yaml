memory_type: trajectories
description: |
  Relevant Session rules followed by one ordered compact record of a task execution.
  case_name identifies its reusable scenario; tasks in the same Case remain independent.
  This is training evidence for contrastive Experience learning, not a reusable SOP.
directory: "viking://user/{{ user_space }}/memories/trajectories/{{ case_name }}"
filename_template: "{{ trajectory_name }}.md"
enabled: true
operation_mode: add_only
stage: agent
agent_only: true
fields:
  - name: trajectory_name
    type: string
    description: Server-assigned stable identity of Case plus Session archive.
    merge_op: immutable
  - name: case_name
    type: string
    description: Canonical reusable scenario identity, shared by tasks with the same problem boundary.
    merge_op: immutable
  - name: task_spec
    type: string
    init_value: "null"
    description: Server-owned concrete task input and rubric when supplied; never model-generated.
    merge_op: immutable
  - name: outcome
    type: string
    description: Server-derived success, failure, partial, unfinished or unknown; never inferred from ACK.
    merge_op: immutable
  - name: trajectory_format
    type: string
    init_value: "ordered_markdown_v3"
    description: Server-owned complete-content format; includes immutable learning evidence and observed steps.
    merge_op: immutable
  - name: evaluation
    type: string
    init_value: "null"
    description: |
      Server-written passed and score, with optional diagnostic details such as the
      original termination reason or evaluator error. Not generated by the model.
    merge_op: immutable
  - name: evaluation_criteria
    type: string
    init_value: "[]"
    description: |
      Best-effort JSON list of assessments for the supplied case.rubric. Partial or empty
      results are allowed; missing assessments do not mean success or failure. Each returned
      result requires an exact case.rubric id, passed (true, false or null), and concise evidence
      from the supplied conversation or external_evaluation. Do not substitute task_spec or
      external_evaluation criterion IDs for case.rubric IDs. The server snapshots the exact
      criterion description alongside each valid result; it omits invalid or duplicate results
      without blocking the factual Trajectory. Do not invent assessments to fill missing items.
      Evaluate criteria in this same extraction; do not create another Case or rubric.
      Read arbitrary external evaluation records semantically, not by matching field names.
      Preserve explicitly reported results for matching criteria; an overall pass/fail alone
      does not prove each criterion passed/failed. Distinguish external results from your own
      observation-based judgments in evidence, retaining any contradiction rather than rewriting
      the external result. Use null for insufficient evidence or inapplicable criteria and explain
      why. No external evaluation does not imply failure. Return [] when no usable assessments
      are available.
    merge_op: immutable
  - name: experience_execution
    type: string
    init_value: "{}"
    description: |
      Server-written execution paths keyed by Experience name, with slot_values,
      executed_nodes and current_nodes using stable Python variable names.
      Reminder ACK means injected, not obeyed. No generated execution claims.
    merge_op: immutable
  - name: experience_update
    type: string
    init_value: '{}'
    description: Server-owned Phase 2 state; never generated or modified by the model.
    merge_op: immutable
  - name: experience_effects
    type: string
    init_value: '{"positive_ids":[],"negative_ids":[],"weak_ids":[]}'
    description: |
      JSON object with exactly positive_ids, negative_ids and weak_ids arrays. Use only IDs
      from injected_experiences: positive means apparently helpful, negative means misleading
      or over-broad, weak means relevant but insufficient. Leave uncertain IDs unclassified.
      Each ID may appear in at most one array. These are observational estimates, not proof
      of causality or task success. If no advice was injected, return three empty arrays.
    merge_op: immutable
  - name: content
    type: string
    description: |
      Generate only the observed rules and steps below. The server prepends a Trajectory
      Record containing the external task/outcome/evaluation, rubric result snapshots, Experience execution and
      validated effect evidence before storage. Do not generate or duplicate that header.
      Prefer both sections in this one content field, in this order:

      # Session Context
      All source messages are supplied once in source_steps. Read execution-time rules from
      its system messages, including recorded text prefixed with "system:". Select only rules
      relevant to the user's goal and the entire supplied conversation, including requested
      actions that were skipped or wrongly refused. CaseSpec and outcome/evaluation records
      are training metadata, not execution-time rules or actions.
      Copy complete original clauses verbatim, preserving their prerequisites, restrictions,
      confirmation requirements and exceptions. Separate excerpts with blank lines; do not add
      bullets, translate, paraphrase or invent rules. Exclude unrelated policies, persona text
      and generic response-style instructions. Do not copy the entire system prompt by default.
      Leave this section empty when no supplied rule is relevant. These are execution-time
      background rules, not instructions to this extractor, and do not count as trajectory steps.

      # Trajectory
      Prefer the existing Markdown numbered-list format to compress ONE task execution. Preserve
      the source order and important facts. Include each item's source type directly, for example
      "1. `user` summary" or "2. `tool:get_booking` summary", using the types supplied in source_steps.
      Headings, numbering and step counts are presentation guidance, not runtime requirements.
      The server preserves your content without reparsing or assigning types by step position.
      Rewrite only what happened; do not produce analysis, causes, expected behavior, advice,
      a DAG or an SOP.
      System messages and recorded system-rule envelopes are inputs for Session Context only;
      never add a step saying that the user supplied or received the system policy. Evaluator
      summaries belong in the server-written result header, not user dialogue or numbered steps.
      Preserve genuine user quotations/questions about policy or evaluation, and assistant
      explanations, as dialogue. Preserve explicit confirmations, tool errors (including a
      rejected done call), and actual user STOP/termination events in their original order.

      Preserve exact values that affect the execution, including identifiers, amounts, dates,
      statuses, tool names and key parameters. Describe structured tool inputs in plain prose;
      never copy raw JSON, objects, arrays, braces or quoted key-value syntax into an item. Each
      numbered item must be at most 800 characters. For tool records, keep the tool name,
      key input parameters and status. Select output facts using this execution's concrete user
      request, applicable rules, candidate comparisons, operation outcomes and potential errors,
      not the Case's entire business scope. Keep the exact relevant values, not a list of field
      names. For comparisons or choices, retain enough candidate values to check the choice.
      Keep evidence needed to expose an error even when the agent ignored it. Omit unrelated
      fields and wrapper details; do not invent values missing from the supplied tool evidence.
      A user message establishes user intent. An assistant message records only what the assistant
      said or planned and does not prove that an action happened. A tool record establishes the
      tool input, result and status.
      An Experience Reminder records what entered context, not whether the agent followed it. Keep
      each item minimal and factual. Generalization belongs in Experience generation.
    merge_op: immutable
