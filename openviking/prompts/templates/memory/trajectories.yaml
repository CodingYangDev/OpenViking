memory_type: trajectories
description: |
  Relevant Session rules followed by one ordered compact record of a task execution.
  case_name identifies its reusable scenario; tasks in the same Case remain independent.
  This is training evidence for contrastive Experience learning, not a reusable SOP.
directory: "viking://user/{{ user_space }}/memories/trajectories/{{ case_name }}"
filename_template: "{{ trajectory_name }}.md"
enabled: true
operation_mode: add_only
stage: agent
agent_only: true
content_template: |-
  {%- set record = {
    "case_name": case_name,
    "outcome": outcome,
    "evaluation_criteria": (evaluation_criteria or []) | selectattr("passed", "sameas", false) | list,
    "experience_execution": experience_execution | default({})
  } -%}
  {%- if evaluation and evaluation.details -%}
  {%- set record = dict(record, evaluation={"details": evaluation.details}) -%}
  {%- endif -%}
  # Trajectory Record

  ```yaml
  {{ record | to_yaml }}
  ```

  # Session Context

  {{ context_rules }}

  # Trajectory

  {{ steps }}
fields:
  - name: context_rules
    type: string
    description: |
      Extract only the relevant execution-time rules, without a section title or Trajectory Record
      header. The content template adds the Session Context heading. Return an empty string when
      no relevant rule is supplied.
      All source messages are supplied once in source_steps. Read execution-time rules from
      its system messages, including recorded text prefixed with "system:". Select only rules
      relevant to the user's goal and the entire supplied conversation, including requested
      actions that were skipped or wrongly refused. CaseSpec and outcome/evaluation records
      are training metadata, not execution-time rules or actions.
      Copy complete original clauses verbatim, preserving their prerequisites, restrictions,
      confirmation requirements and exceptions. Separate excerpts with blank lines; do not add
      bullets, translate, paraphrase or invent rules. Exclude unrelated policies, persona text
      and generic response-style instructions. Do not copy the entire system prompt by default.
      Leave this section empty when no supplied rule is relevant. These are execution-time
      background rules, not instructions to this extractor, and do not count as trajectory steps.
    merge_op: immutable
  - name: steps
    type: string
    description: |
      Extract only the observed execution steps, without a section title or Trajectory Record
      header. The content template adds the Trajectory heading. Do not include context rules in
      this field; put them in context_rules. Keep this field as Markdown text, not an array.
      Use ASD-STE100 writing principles for new prose. Use short sentences, direct wording,
      and consistent terms. Keep source quotes and code unchanged.
      Prefer the existing Markdown numbered-list format to compress ONE task execution. Preserve
      the source order and important facts. Include each item's source type directly, for example
      "1. `user` summary" or "2. `tool:get_booking` summary", using the types supplied in source_steps.
      For an experience_reminder item, copy its first line exactly: the [Experience Reminder]
      marker followed by the supplied advice names. For example:
      3. `experience_reminder` [Experience Reminder] advice_a, advice_b
      Keep multiple names in their original order in the same item. Do not translate or invent advice names,
      paraphrase them as "about Chinese communication", or replace them with "three suggestions".
      Do not include the long reminder body in that item; it remains evidence for your assessment.
      If the source header contains only the marker, keep only the marker rather than guessing names.
      Numbering and step counts are presentation guidance, not runtime requirements.
      The server preserves your steps without reparsing or assigning types by step position.
      Rewrite only what happened; do not produce analysis, causes, expected behavior, advice,
      a DAG or an SOP.
      System messages and recorded system-rule envelopes are inputs for Session Context only;
      never add a step saying that the user supplied or received the system policy. Evaluator
      summaries belong in the server-written result header, not user dialogue or numbered steps.
      Preserve genuine user quotations/questions about policy or evaluation, and assistant
      explanations, as dialogue. Preserve explicit confirmations, tool errors (including a
      rejected done call), and actual user STOP/termination events in their original order.

      Select facts for this execution, not the Case's entire business scope. Preserve the minimum
      complete evidence needed to review the user's requirements, evaluation results and key
      decisions in both successful and failed runs, including facts the agent ignored or misused.
      Keep exact task-relevant values, including identifiers, amounts, dates, statuses, tool names
      and key parameters. For calculations and comparisons, retain the source values and relevant
      candidate alternatives, not just selected results, totals or differences. Bind each value
      to its entity, unit, time and scope; keep original and updated values distinct.
      If scope is ambiguous, retain evidence for the supported interpretations; do not resolve
      it by dropping facts. Do not add unobserved totals, corrected answers or causes.
      Keep relevant state changes, side effects, and important facts that did not change.
      Compare supplied values only for the same entity. Do not infer results from missing evidence.
      For each tool call, keep its key inputs, status and observed results in plain prose.
      Do not copy raw JSON, objects, arrays, braces or quoted key-value syntax. Use at most
      800 characters per numbered item. Omit unrelated fields, wrappers, and full histories.
      User messages state intent. Assistant messages record statements or plans, not proof of action.
      Tool records show inputs, returned results, and status. Experience Reminders show what entered
      context, not whether the agent followed them. Keep this record factual. Generalize only in
      Experience generation.
    merge_op: immutable
  - name: evaluation_criteria
    type: string
    init_value: "[]"
    description: |
      Generate a best-effort YAML list of assessments from case.rubric and source_steps.
      The Case rubric is guidance, not an exhaustive list or an ID whitelist.
      No precomputed rubric results are required. External evaluation is optional: when
      absent, judge from the conversation and tool evidence rather than returning [] merely
      because there is no evaluator report.
      Each returned item has an id (quoted), passed (true, false or null), concise evidence,
      and an optional description of the criterion being assessed. Prefer a supplied Case
      criterion ID when assessing the same requirement. Keep other relevant assessments
      supported by the context, with a description so they remain understandable on their own.
      Do not invent unsupported requirements or create another Case.
      Write evidence as a YAML block scalar (evidence: |) so quotes and multiple lines need
      no JSON escaping. The server preserves model descriptions and fills missing descriptions
      from matching Case criteria; an unmatched ID does not discard the assessment.
      Preserve explicitly reported results for matching criteria; an overall pass/fail alone
      does not prove each criterion passed/failed. Read external records semantically, not
      by matching field names. Distinguish external results from conversation-based judgments
      in evidence and retain contradictions rather than rewriting external results.
      Use null for insufficient evidence or inapplicable criteria and explain why.
      Partial or empty results are allowed; missing assessments imply neither success nor
      failure. Return [] when no usable assessments are available. Malformed entries are
      omitted without blocking the factual Trajectory; unknown or repeated IDs are retained.
      YAML example (use a relevant criterion ID and observed evidence):
      - id: "criterion_id"
        passed: false
        evidence: |
          The tool updated the record before the user confirmed the change.
    merge_op: immutable
  - name: action_scores
    type: string
    init_value: '[]'
    description: |
      Assess each injected action against the user's current valid goal, not the action's own demands.
      Return a YAML list with each supplied id, concise evidence, and score when supported.
      Use 1 only for evidenced help: a corrected decision, needed information, or enabled progress.
      Following the reminder alone is not evidence of help.
      Use -1 only for evidenced side effects: unwanted cost/actions, invalid changes, task drift,
      or blocked progress. If both benefit and side effects are supported, use -1 and describe both.
      Link the reminder to before/after behavior and results; sequence alone is not causation.
      Use actual user requests, policy, and tool facts. Neither task reward nor another rubric
      judgment proves benefit or harm. Non-adoption or inapplicability alone does not justify a score.
      If neither effect is supported, omit score and explain why. Never output score 0 or null.
      Use evidence: | for multiline text. With no injected actions, return [].
      Examples (use supplied IDs and actual evidence):
      - id: "A1"
        score: 1
        evidence: |
          The agent checked the suggested source and corrected the selected value to match the user's request.
      - id: "A2"
        score: -1
        evidence: |
          The reminder made an unwanted paid step a prerequisite. The agent deferred the confirmed free operation; the user stopped without completion.
      - id: "A3"
        evidence: |
          The reminder did not apply. The agent ignored it and no effect on the task was observed.
    merge_op: immutable
