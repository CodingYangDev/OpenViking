memory_type: ss_plot
enabled: true
stage: user
peer_enabled: false
operation_mode: upsert
directory: "viking://user/{{ user_space }}/memories/ss/projects"
filename_template: "{{ project_id }}/plots/{{ plot_id }}/plot.md"
description: |
  SS Plot 记忆：一个 Plot 整体或其多个 Clip 共用的要求。

  先逐条分类，分类与作用层级相互独立。下列标签只用于内部筛选和评测，禁止写入 content：
  - [额外配置]（保留）：用户明确表达、当前回复完成后仍有用、且不属于对象已有数据的要求。
  - [基础配置]（不保留）：Project、Plot、Clip、角色、场景、道具、素材或当前 Prompt 中已有的信息。
  - [单次行为]（不保留）：开始生成、重跑、查看、继续、发送确认卡等一次性动作。
  - [结果评价]（不保留）：只有评价而没有可执行方向；同句中的明确方向须拆成独立 [额外配置]。
  - [任务输入]（不保留）：完整剧本、分镜、Prompt、时间轴、附件转写或既有输出本身；可从中另行提炼未来仍有用的明确要求。
  - [已失效]（不保留）：被同层级更晚的明确指令替代的旧要求。
  - [模型推断]（不保留）：用户未明确表达、被补充、扩大对象或提升范围的内容。
  - [非用户来源]（不保留）：System、Assistant、工具结果和路由元数据中的内容；它们只能辅助消解指代与路由。
  - [上下文不足]（不保留）：无法从完整可用上下文唯一确定作用对象或范围的内容。

  共同规则：
  - 每条候选必须拆成一个原子事实并完成上述分类；只有 [额外配置] 可以写入 Memory，同一事实只写一处。
  - 不得通过给内容加上“[额外配置]”字样绕过筛选；必须先判断其真实类别。
  - 事实必须由用户明确表达。允许压缩措辞，但不得补充要求、扩大对象或改变范围。
  - 用户以“好的、确认、用2”等明确采纳 Assistant 提议时，可用被唯一指向的提议还原内容；纯执行确认仍是 [单次行为]。
  - 作用层级只按用户当时表达所指向的对象和完整可用上下文判断，不能由分类标签决定。
  - 可用显式 ID、资源归属、当前焦点、对象清单、前序对话、确认卡或工具操作解析真实对象；只能使用唯一匹配的真实 ID，禁止生成 placeholder。
  - 同一规则在多个 Plot 重复出现不能自动提升为 Project；同层级相同配置合并并聚合证据。
  - 同层级冲突时只保留最新明确要求；窄范围配置只在自身范围内覆盖宽范围默认值。
  - “角色A参考素材X”“当前分辨率720”“拆成两个20秒片段”属于 [基础配置]；“梳理、检查、生成、重写、发确认卡”属于 [单次行为]，均不得写入。

  本层：
  - 单个 Plot 的剧情、空间、表演、总节奏，或同一 Plot 多个 Clip 的共同要求，写 ss_plot。
  - 属于该 Plot 的事实只能保存在 ss_plot 或其 ss_clip，不能写入 ss_project。
  - 单个 Clip 的局部要求已唯一定位时，targets 只含 clip 或同时含 plot 均归 ss_clip；recorded_focus 为 Plot 不能改变该归属。
  - 只有用户明确要求整个 Plot 或涉及同一 Plot 的多个 Clip 共同遵守时，才写 ss_plot；没有明确 Clip 目标时，才按可靠的 Plot 目标判断。
  - 单个 Clip 的时长、版本、参考或局部修改写 ss_clip；跨多个 Plot 写 ss_project。
  - 只有标题、焦点、基础配置、单次行为、结果评价或工具状态时不创建文件。ID 只能由上下文解析，不能猜测或使用 placeholder。
  - 例：Plot focus 为 plot_A，用户说“这场景别太一致” -> plot_A；不能写 Project。

  格式：content 只含“- ”列表；一行一个最终约束，尽量不超过 40 字；不写标签、标题、解释、过程、行号或 Tab，保留必要 ID、数值、范围与否定。
fields:
  - name: project_id
    type: string
    merge_op: immutable
    description: 稳定父项目 ID。
  - name: plot_id
    type: string
    merge_op: immutable
    description: 上下文证据支持的稳定 Plot ID。
  - name: content
    type: string
    merge_op: patch
    description: 仅写单个 Plot 整体或其多个 Clip 共用的 [额外配置] 正文，不写分类标签；禁止写入 Project 或与 Clip 重复；每行一个简短“- ”约束。
embedding_template: |-
  {{ content }}
