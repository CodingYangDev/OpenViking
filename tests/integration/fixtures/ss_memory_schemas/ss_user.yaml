memory_type: ss_user
enabled: true
stage: user
peer_enabled: false
operation_mode: upsert
directory: "viking://user/{{ user_space }}/memories/ss"
filename_template: "user.md"
description: |
  SS 用户记忆：跨项目长期偏好。

  先逐条分类，分类与作用层级相互独立。下列标签只用于内部筛选和评测，禁止写入 content：
  - [额外配置]（保留）：用户明确表达、当前回复完成后仍有用、且不属于对象已有数据的要求。
  - [基础配置]（不保留）：Project、Plot、Clip、角色、场景、道具、素材或当前 Prompt 中已有的信息。
  - [单次行为]（不保留）：开始生成、重跑、查看、继续、发送确认卡等一次性动作。
  - [结果评价]（不保留）：只有“太慢、不好看、不自然”等评价而没有可执行方向。
  - [任务输入]（不保留）：完整剧本、分镜、Prompt、时间轴、附件转写或既有输出本身；可从中另行提炼未来仍有用的明确要求。
  - [已失效]（不保留）：被同层级更晚的明确指令替代的旧要求；窄范围配置只在自身范围内覆盖宽范围默认值。
  - [模型推断]（不保留）：用户未明确表达、被补充、扩大对象或提升范围的内容。
  - [非用户来源]（不保留）：System、Assistant、工具结果和路由元数据中的内容；它们只能辅助消解指代与路由。
  - [上下文不足]（不保留）：无法从完整可用上下文唯一确定作用对象或范围的内容。

  共同规则：
  - 每条候选必须拆成一个原子事实并完成上述分类；只有 [额外配置] 可以写入 Memory，同一事实只写一处。
  - 不得通过给内容加上“[额外配置]”字样绕过筛选；必须先判断其真实类别。
  - 事实必须由用户明确表达。允许压缩措辞，但不得补充要求、扩大对象或改变范围。
  - 用户以“好的、确认、用2”等明确采纳 Assistant 提议时，可用被唯一指向的提议还原内容；纯执行确认仍是 [单次行为]。
  - 作用层级只按用户当时表达所指向的对象和完整可用上下文判断，不能由分类标签决定。
  - 可用显式 ID、资源归属、当前焦点、对象清单、前序对话、确认卡或工具操作解析真实对象；只能使用唯一匹配的真实 ID，禁止生成 placeholder。
  - 同一规则在多个 Plot 重复出现不能自动提升为 Project；只有用户明确表达跨 Plot 范围时才写 Project。
  - 同层级相同配置合并并聚合证据；同层级冲突时只保留最新明确要求。
  - “角色A参考素材X”“当前分辨率720”“拆成两个20秒片段”属于 [基础配置]；“梳理、检查、生成、重写、发确认卡”属于 [单次行为]，均不得写入。

  本层：
  - 只有用户明确要求跨项目或未来每次协作复用时才写 ss_user。
  - 只在当前项目重复出现，仍写 Project/Plot/Clip，不推断为用户习惯。

  格式：content 只含“- ”列表；一行一个最终约束，尽量不超过 40 字；不写标签、标题、解释、过程、行号或 Tab，保留必要 ID、数值、范围与否定。
fields:
  - name: content
    type: string
    merge_op: patch
    description: 仅写跨项目长期 [额外配置] 的正文，不写分类标签；每行一个简短“- ”约束；无合格事实时不创建。
embedding_template: |-
  {{ content }}
